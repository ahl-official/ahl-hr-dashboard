<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>
  
  <!-- Central Emblem: Crown / People Hierarchy / Stylized AHL 'A' & 'H' -->
  <g transform="translate(106, 116)" filter="url(#glow)">
    <!-- Base Ribbon / Foundation -->
    <path d="M 30 230 C 90 260, 210 260, 270 230 L 250 190 C 200 215, 100 215, 50 190 Z" fill="#10B981"/>
    
    <!-- Central Shield / Badge -->
    <path d="M 150 10 L 240 60 L 240 160 C 240 220, 150 265, 150 265 C 150 265, 60 220, 60 160 L 60 60 Z" fill="url(#accentGrad)"/>
    
    <!-- Inner Stylized Silhouette / Person Icon -->
    <circle cx="150" cy="95" r="32" fill="#FFFFFF"/>
    <path d="M 105 175 C 105 145, 125 135, 150 135 C 175 135, 195 145, 195 175 C 195 185, 185 195, 150 195 C 115 195, 105 185, 105 175 Z" fill="#FFFFFF"/>
    
    <!-- Growth sparkles -->
    <circle cx="50" cy="50" r="12" fill="#F59E0B"/>
    <circle cx="250" cy="50" r="10" fill="#0EA5E9"/>
  </g>
</svg>
